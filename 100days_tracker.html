<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Days — Progress Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0d0f14;
    --surface:   #13161e;
    --surface2:  #1b1f2b;
    --border:    #ffffff0f;
    --gold:      #f0b429;
    --gold-dim:  #f0b42933;
    --green:     #3ecf8e;
    --green-dim: #3ecf8e22;
    --text:      #e8eaf0;
    --muted:     #6b7280;
    --danger:    #f87171;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Noise texture overlay ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0; opacity: 0.6;
  }

  /* ── Glow orbs ── */
  .orb {
    position: fixed; border-radius: 50%;
    filter: blur(100px); pointer-events: none; z-index: 0;
  }
  .orb-1 { width: 500px; height: 500px; background: #f0b42914; top: -150px; right: -100px; }
  .orb-2 { width: 400px; height: 400px; background: #3ecf8e0d; bottom: -100px; left: -80px; }

  /* ── Layout ── */
  .wrapper {
    position: relative; z-index: 1;
    max-width: 900px; margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* ── Header ── */
  header { margin-bottom: 48px; }
  .header-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 11px; font-weight: 400;
    letter-spacing: 0.25em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 12px;
    opacity: 0;
    animation: fadeUp 0.6s 0.1s forwards;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 6vw, 4rem);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.02em;
    opacity: 0;
    animation: fadeUp 0.6s 0.2s forwards;
  }
  h1 span { color: var(--gold); }

  /* ── Stats bar ── */
  .stats {
    display: flex; gap: 24px; flex-wrap: wrap;
    margin-top: 28px;
    opacity: 0;
    animation: fadeUp 0.6s 0.35s forwards;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 22px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .stat-value {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem; font-weight: 700;
    color: var(--gold);
    line-height: 1;
  }
  .stat-label {
    font-size: 11px; color: var(--muted);
    letter-spacing: 0.08em; text-transform: uppercase;
  }

  /* ── Progress bar ── */
  .progress-wrap {
    margin-top: 28px;
    opacity: 0;
    animation: fadeUp 0.6s 0.45s forwards;
  }
  .progress-meta {
    display: flex; justify-content: space-between;
    font-family: 'DM Mono', monospace;
    font-size: 12px; color: var(--muted);
    margin-bottom: 8px;
  }
  .progress-track {
    height: 6px; background: var(--surface2);
    border-radius: 99px; overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--green));
    border-radius: 99px;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    width: 0%;
  }

  /* ── Grid ── */
  .grid-section {
    margin-top: 48px;
    opacity: 0;
    animation: fadeUp 0.6s 0.55s forwards;
  }
  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: var(--muted);
    letter-spacing: 0.2em; text-transform: uppercase;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 10px;
  }

  .day-btn {
    aspect-ratio: 1;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .day-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: var(--gold-dim);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .day-btn:hover::before { opacity: 1; }
  .day-btn:hover {
    border-color: var(--gold);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px #f0b42920;
  }
  .day-num {
    font-family: 'DM Mono', monospace;
    font-size: 10px; font-weight: 500;
    color: var(--muted);
    line-height: 1;
  }
  .day-icon { font-size: 14px; line-height: 1; }

  /* Done state */
  .day-btn.done {
    background: var(--green-dim);
    border-color: var(--green);
  }
  .day-btn.done .day-num { color: var(--green); }
  .day-btn.done:hover {
    border-color: var(--danger);
    box-shadow: 0 8px 24px #f8717120;
  }
  .day-btn.done:hover::before {
    background: #f8717115;
    opacity: 1;
  }

  /* Pulse animation on completion */
  @keyframes pulse-ring {
    0%   { box-shadow: 0 0 0 0 #3ecf8e55; }
    70%  { box-shadow: 0 0 0 14px #3ecf8e00; }
    100% { box-shadow: 0 0 0 0 #3ecf8e00; }
  }
  .day-btn.just-done { animation: pulse-ring 0.6s ease-out; }

  /* ── Reset button ── */
  .footer {
    margin-top: 48px; text-align: center;
    opacity: 0;
    animation: fadeUp 0.6s 0.65s forwards;
  }
  .reset-btn {
    background: transparent;
    border: 1px solid #ffffff18;
    color: var(--muted);
    padding: 10px 24px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .reset-btn:hover {
    border-color: var(--danger);
    color: var(--danger);
  }

  /* ── Modal ── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: #00000088;
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px;
    max-width: 360px; width: 90%;
    text-align: center;
    transform: translateY(20px) scale(0.96);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 32px 80px #000000bb;
  }
  .modal-backdrop.open .modal { transform: translateY(0) scale(1); }

  .modal-icon { font-size: 2.8rem; margin-bottom: 12px; line-height: 1; }
  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem; font-weight: 700;
    margin-bottom: 8px;
  }
  .modal-sub { font-size: 14px; color: var(--muted); line-height: 1.5; }
  .modal-day {
    font-family: 'DM Mono', monospace;
    font-size: 13px; color: var(--gold);
    margin: 16px 0;
    background: var(--gold-dim);
    border-radius: 8px; padding: 8px 14px;
    display: inline-block;
  }
  .modal-actions {
    display: flex; gap: 10px; margin-top: 24px;
  }
  .btn {
    flex: 1; padding: 12px;
    border-radius: 10px; border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-cancel {
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-cancel:hover { color: var(--text); }
  .btn-confirm {
    background: var(--green);
    color: #0d1a12;
    font-weight: 600;
  }
  .btn-confirm:hover { filter: brightness(1.1); }
  .btn-danger {
    background: var(--danger);
    color: #1a0505;
    font-weight: 600;
  }
  .btn-danger:hover { filter: brightness(1.1); }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface);
    border: 1px solid var(--green);
    color: var(--green);
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 14px; font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    box-shadow: 0 16px 48px #000000aa;
    z-index: 200;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── Animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .grid { grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .day-icon { font-size: 12px; }
    .day-num  { font-size: 9px; }
  }
</style>
</head>
<body>

<!-- Atmosphere -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="wrapper">

  <!-- Header -->
  <header>
    <p class="header-eyebrow">Personal Challenge</p>
    <h1>100 Days of<br><span>Progress</span></h1>

    <div class="stats">
      <div class="stat">
        <span class="stat-value" id="stat-done">0</span>
        <span class="stat-label">Days Done</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-left">100</span>
        <span class="stat-label">Remaining</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-pct">0%</span>
        <span class="stat-label">Complete</span>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-meta">
        <span>Progress</span>
        <span id="progress-text">0 / 100</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  </header>

  <!-- Grid -->
  <section class="grid-section">
    <p class="section-label">Tap a day to mark it complete</p>
    <div class="grid" id="grid"></div>
  </section>

  <!-- Footer -->
  <div class="footer">
    <button class="reset-btn" onclick="openResetModal()">↺ Reset all progress</button>
  </div>
</div>

<!-- Confirmation Modal -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-icon" id="modal-icon">✅</div>
    <div class="modal-title" id="modal-title">Mark as Complete?</div>
    <div class="modal-sub"  id="modal-sub">Make sure you actually finished today's work before marking it done!</div>
    <div class="modal-day"  id="modal-day">Day 01</div>
    <div class="modal-actions">
      <button class="btn btn-cancel"  onclick="closeModal()">Cancel</button>
      <button class="btn btn-confirm" id="modal-confirm-btn" onclick="confirmAction()">Yes, Done! ✓</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">🎉 Day marked as complete!</div>

<script>
// ── Storage (localStorage as offline SQLite-equivalent) ──────────────────────
// Since this is a self-contained HTML file, we use localStorage to persist data.
// It works fully offline and behaves like a simple key-value database.

const DB_KEY = '100days_v1';

function loadDB() {
  try {
    return JSON.parse(localStorage.getItem(DB_KEY)) || {};
  } catch { return {}; }
}

function saveDB(db) {
  localStorage.setItem(DB_KEY, JSON.stringify(db));
}

function isDone(day) { return !!loadDB()[day]; }

function setDone(day, val) {
  const db = loadDB();
  db[day] = val;
  saveDB(db);
}

function resetAll() {
  localStorage.removeItem(DB_KEY);
}

function countDone() {
  const db = loadDB();
  return Object.values(db).filter(Boolean).length;
}

// ── Build grid ────────────────────────────────────────────────────────────────
function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const db = loadDB();

  for (let d = 1; d <= 100; d++) {
    const done = !!db[d];
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (done ? ' done' : '');
    btn.id = `day-${d}`;
    btn.title = done ? `Day ${d} — completed ✓` : `Day ${d} — click to complete`;
    btn.innerHTML = `
      <span class="day-icon">${done ? '✓' : '○'}</span>
      <span class="day-num">${String(d).padStart(2,'0')}</span>
    `;
    btn.onclick = () => openModal(d);
    grid.appendChild(btn);
  }
  updateStats();
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function updateStats() {
  const done = countDone();
  const pct  = Math.round(done);
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-left').textContent = 100 - done;
  document.getElementById('stat-pct').textContent  = pct + '%';
  document.getElementById('progress-text').textContent = `${done} / 100`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ── Modal ─────────────────────────────────────────────────────────────────────
let pendingDay    = null;
let pendingAction = null; // 'complete' | 'undo' | 'reset'

function openModal(day) {
  const done = isDone(day);
  pendingDay    = day;
  pendingAction = done ? 'undo' : 'complete';

  document.getElementById('modal-day').textContent = `Day ${String(day).padStart(2,'0')}`;

  if (!done) {
    document.getElementById('modal-icon').textContent   = '✅';
    document.getElementById('modal-title').textContent  = 'Mark as Complete?';
    document.getElementById('modal-sub').textContent    = "Make sure you actually finished today's work before marking it done!";
    const btn = document.getElementById('modal-confirm-btn');
    btn.textContent = 'Yes, Done! ✓';
    btn.className   = 'btn btn-confirm';
  } else {
    document.getElementById('modal-icon').textContent   = '↩️';
    document.getElementById('modal-title').textContent  = 'Unmark this day?';
    document.getElementById('modal-sub').textContent    = 'This will remove the completion mark for this day.';
    const btn = document.getElementById('modal-confirm-btn');
    btn.textContent = 'Yes, Unmark';
    btn.className   = 'btn btn-danger';
  }

  document.getElementById('modal').classList.add('open');
}

function openResetModal() {
  pendingDay    = null;
  pendingAction = 'reset';
  document.getElementById('modal-icon').textContent  = '⚠️';
  document.getElementById('modal-title').textContent = 'Reset All Progress?';
  document.getElementById('modal-sub').textContent   = 'This will permanently clear all 100 days. There is no undo!';
  document.getElementById('modal-day').textContent   = 'All 100 days';
  const btn = document.getElementById('modal-confirm-btn');
  btn.textContent = 'Yes, Reset Everything';
  btn.className   = 'btn btn-danger';
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  pendingDay = pendingAction = null;
}

function confirmAction() {
  if (pendingAction === 'complete') {
    setDone(pendingDay, true);
    const btn = document.getElementById(`day-${pendingDay}`);
    btn.className = 'day-btn done just-done';
    btn.innerHTML = `<span class="day-icon">✓</span><span class="day-num">${String(pendingDay).padStart(2,'0')}</span>`;
    btn.title = `Day ${pendingDay} — completed ✓`;
    setTimeout(() => btn.classList.remove('just-done'), 700);
    updateStats();
    showToast(`🎉 Day ${pendingDay} complete! Keep going!`);
  } else if (pendingAction === 'undo') {
    setDone(pendingDay, false);
    const btn = document.getElementById(`day-${pendingDay}`);
    btn.className = 'day-btn';
    btn.innerHTML = `<span class="day-icon">○</span><span class="day-num">${String(pendingDay).padStart(2,'0')}</span>`;
    btn.title = `Day ${pendingDay} — click to complete`;
    updateStats();
    showToast(`↩ Day ${pendingDay} unmarked.`, false);
  } else if (pendingAction === 'reset') {
    resetAll();
    buildGrid();
    showToast('↺ All progress has been reset.', false);
  }
  closeModal();
}

// Close modal on backdrop click
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, success = true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = success ? 'var(--green)' : 'var(--muted)';
  t.style.color       = success ? 'var(--green)' : 'var(--muted)';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Init ──────────────────────────────────────────────────────────────────────
buildGrid();
</script>
</body>
</html>
